plugins {
    id 'com.android.application'
}

apply from: rootProject.file('independent.gradle')

android {
    namespace 'sa.urtv.screensaver'
    compileSdk 34

    defaultConfig {
        applicationId 'sa.urtv.screensaver'
        minSdk 21
        targetSdk 34
        versionCode project.ext.urtvVersionCode
        versionName "2.${project.ext.urtvVersionCode}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Configured by independent.gradle only when all external signing inputs exist.
        }
    }

    // the page is built by ../../src/build.py into dist/
    sourceSets {
        main { assets.srcDirs = ['../../dist', '../../assets/shared', '../launcher/src/main/assets', '../../assets'] }   // page, teams-ar.json, Thmanyah fonts, backgrounds/
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
