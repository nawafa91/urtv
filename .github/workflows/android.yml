name: Build unsigned APKs

on:
  push:
    branches: [master, feat/independent-setup]
    paths: ['src/**', 'assets/**', 'config/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['src/**', 'assets/**', 'config/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: python3 src/build.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Signing stays outside GitHub. No signing secrets and no release publication.
      - name: Build unsigned APKs
        run: gradle -p android assembleRelease --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks
          path: |
            android/app/build/outputs/apk/release/*-unsigned.apk
            android/launcher/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
